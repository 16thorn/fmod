<html lang="en">
<head>

<style>
@font-face { font-family:"Prime"; src:url("assets/fonts/Prime-Regular.ttf"); font-display:swap; }
@font-face { font-family:"PrimeLight"; src:url("assets/fonts/Prime-Light.ttf"); font-display:swap; }
@font-face { font-family:"Orbitron"; src:url("assets/fonts/Orbitron-Bold.ttf"); font-display:swap; }

:root{
  --navy-0:#06140b; --navy-1:#0b3a1e; --navy-2:#124023;
  --blue-mid:#155a2c; --blue:#2b9b4f; --blue-br:#22c55e;
  --blue-glow:#4ade80; --blue-hot:#57e389; --blue-hi:#86efac;
  --text:#eafff0; --text-soft:#9fe9bf; --text-dim:#6fbf90;
  --border:#2b9b4f;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Prime",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:#05080d;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  cursor:default;
  user-select:none; -webkit-user-select:none;
}

/* ---------- Background ---------- */
/* still-image fallback (shows if the video is missing / still loading) */
.bg{
  position:fixed; inset:0; z-index:-4;
  background:url("assets/bg.png") center/cover no-repeat;
  transform:scale(1.08);
  filter:brightness(0.5) saturate(1.1);
}
/* looping background video (drop your clip at assets/bg.mp4) */
.bgvid{
  position:fixed; inset:0; z-index:-3;
  width:100%; height:100%; object-fit:cover;
  filter:brightness(0.5) saturate(1.15);
}

/* green tint + vignette on top */
.bg-tint{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(34,197,94,0.20), transparent 55%),
    radial-gradient(120% 90% at 50% 100%, rgba(6,26,14,0.85), transparent 60%),
    linear-gradient(180deg, rgba(5,8,7,0.35), rgba(5,8,7,0.72));
}

/* drifting starfield / sparkles */
.stars{
  position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:0.5;
  background-image:
    radial-gradient(circle at 15% 25%, rgba(255,255,255,.9) .8px, transparent 1.6px),
    radial-gradient(circle at 72% 62%, rgba(200,255,220,.85) .8px, transparent 1.6px),
    radial-gradient(circle at 45% 82%, rgba(255,255,255,.8) .8px, transparent 1.6px),
    radial-gradient(circle at 86% 24%, rgba(180,255,210,.8) .8px, transparent 1.4px),
    radial-gradient(circle at 30% 55%, rgba(255,255,255,.75) .7px, transparent 1.4px),
    radial-gradient(circle at 60% 15%, rgba(210,255,225,.8) .7px, transparent 1.4px);
  animation:twinkle 3.2s ease-in-out infinite;
}
@keyframes twinkle{ 0%,100%{opacity:.28;} 50%{opacity:.6;} }

/* interactive sparkle canvas */
#fx{ position:fixed; inset:0; z-index:-1; pointer-events:none; }

/* ---------- Enter splash (Pavlov-style) ---------- */
#enter{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  background:rgba(4,10,6,0.64); backdrop-filter:blur(12px) saturate(1.1);
  transition:opacity .55s ease, visibility .55s ease;
}
#enter.gone{opacity:0; visibility:hidden;}

/* faint watermark handle behind the button */
#enter .wm{
  position:absolute; top:calc(50% - 130px); left:0; right:0; text-align:center;
  font-family:"Orbitron"; font-size:clamp(3rem,14vw,7rem);
  letter-spacing:.12em; color:rgba(74,222,128,.07);
  text-transform:uppercase; pointer-events:none; user-select:none; white-space:nowrap;
}

#enter .enter-row{ display:flex; align-items:stretch; }

.enter-btn{
  position:relative; overflow:hidden; cursor:pointer;
  min-width:300px; padding:26px 40px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  background:linear-gradient(135deg,#06140b 0%,#0f4d24 45%,#166b32 55%,#06140b 100%);
  background-size:250% 250%;
  animation:btnGradientMove 6s linear infinite;
  border:1.5px solid var(--border);
  clip-path:polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  transition:transform .18s ease-out, border-color .18s;
}
.enter-btn::before{
  content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.95) 1px, transparent 2.6px),
    radial-gradient(circle at 72% 62%, rgba(200,255,220,.9) 1px, transparent 2.4px),
    radial-gradient(circle at 45% 82%, rgba(255,255,255,.9) 1px, transparent 2.4px),
    radial-gradient(circle at 86% 24%, rgba(180,255,210,.9) 1px, transparent 2.2px),
    radial-gradient(circle at 12% 68%, rgba(255,255,255,.85) 1px, transparent 2.2px);
  background-repeat:no-repeat;
  animation:twinkle 2.8s ease-in-out infinite;
}
.enter-btn > *{ position:relative; z-index:1; }

.enter-btn .arrow-box{
  width:44px; height:44px; background:var(--blue); display:grid; place-items:center;
  transition:background .18s;
}
.enter-btn .arrow-box .tri{
  width:0; height:0;
  border-top:11px solid transparent; border-bottom:11px solid transparent;
  border-left:16px solid var(--navy-2); margin-left:4px;
  transition:border-left-color .18s;
}
.enter-btn .txt{
  font-family:"Orbitron"; letter-spacing:.34em; text-transform:uppercase;
  font-size:.9rem; color:var(--text-soft); padding-left:.34em;
}
.enter-btn .sub{
  font-family:"PrimeLight","Prime",sans-serif; font-size:.78rem; letter-spacing:.16em;
  color:var(--text-soft); text-transform:uppercase; text-shadow:0 0 8px rgba(74,222,128,.5);
}
#enter:hover .enter-btn .sub{ color:#fff; }
.enter-btn .accent{
  position:absolute; left:0; bottom:0; height:2px; width:100%; z-index:1;
  background:linear-gradient(90deg, transparent 8%, var(--blue-br) 50%, transparent 92%);
}
#enter:hover .enter-btn{
  background:linear-gradient(135deg,#0f5a2a 0%,#22c55e 45%,#57e389 55%,#0f5a2a 100%);
  background-size:250% 250%;
  border-color:var(--blue-hi); transform:scale(1.05);
}
#enter:hover .enter-btn .txt{ color:#fff; }
#enter:hover .enter-btn .arrow-box{ background:var(--blue-hot); }
#enter:hover .enter-btn .arrow-box .tri{ border-left-color:#fff; }

/* ---------- Card ---------- */
.stage{ position:fixed; inset:0; display:grid; place-items:center; padding:24px; }
.card{
  width:min(440px,100%);
  background:linear-gradient(180deg, rgba(16,74,40,0.22), rgba(6,20,11,0.34));
  border:1px solid rgba(74,222,128,.35);
  border-radius:20px;
  padding:38px 30px 30px;
  text-align:center;
  backdrop-filter:blur(7px) saturate(1.1);
  box-shadow:0 24px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;
  opacity:0; transform:translateY(18px) scale(.98);
}
.card.show{ animation:cardIn .7s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes cardIn{ to{opacity:1; transform:none;} }

.card::before{
  content:""; position:absolute; top:-1px; left:16%; right:16%; height:2px;
  background:linear-gradient(90deg, transparent, var(--blue-hot), transparent);
  filter:drop-shadow(0 0 6px var(--blue-glow));
}

.avatar-wrap{ width:132px; height:132px; margin:0 auto 14px; position:relative; }
@keyframes spin{ to{transform:rotate(360deg);} }
.avatar{
  position:absolute; width:80%; height:80%; left:50%; top:50%;
  transform:translate(-50%,-50%); z-index:1; border-radius:50%;
  background:var(--navy-0) url("assets/avatar.png") center/cover;
  box-shadow:0 0 22px rgba(74,222,128,.35), inset 0 0 0 2px rgba(6,20,11,.9);
}
.deco{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain; z-index:2; pointer-events:none;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.45));
  animation:decoBob 4.5s ease-in-out infinite;
}
@keyframes decoBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }

.name{

  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  text-shadow:0 0 30px rgba(74,222,128,.25);
}
.handle{ color:var(--text-dim); font-size:.95rem; margin-top:4px; letter-spacing:.05em; }
.tag{

.about{ color:#d3ecd9; font-size:.98rem; line-height:1.6; margin:20px 4px 4px; }

/* ---------- Pavlov-style buttons ---------- */
@keyframes btnGradientMove{ 0%{background-position:0% 0%;} 50%{background-position:100% 100%;} 100%{background-position:0% 0%;} }

.btn::after{

  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.9) 1px, transparent 2.4px),
    radial-gradient(circle at 72% 62%, rgba(200,255,220,.85) 1px, transparent 2.2px),

  opacity:.4; animation:twinkle 2.8s ease-in-out infinite;

.btn:nth-of-type(2n)::after{ animation-duration:3.4s; animation-delay:-.9s; }
.btn:nth-of-type(3n)::after{ animation-duration:2.3s; animation-delay:-1.6s; }

.btn .ico{ width:26px; height:26px; flex:0 0 26px; display:grid; place-items:center; z-index:1; }
.btn .ico svg{ width:22px; height:22px; fill:currentColor; }
.btn .l{ z-index:1; font-weight:400; }

.btn:hover .l small{ color:#d3ecd9; }
.btn .chev{ margin-left:auto; z-index:1; opacity:.6; font-size:1.1rem; }

.footer{ margin-top:22px; color:var(--text-dim); font-size:.72rem; letter-spacing:.08em; }

/* ---------- music toggle ---------- */
.music{
  position:fixed; right:18px; bottom:18px; z-index:60;
  width:46px; height:46px; display:grid; place-items:center;
  background:linear-gradient(135deg,#06140b,#166b32);
  border:1px solid var(--border); border-radius:12px;
  color:var(--text-soft); cursor:pointer; font-size:1.2rem;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  opacity:0; transform:translateY(10px) scale(.9); pointer-events:none;

}
.music.show{ opacity:1; transform:none; pointer-events:auto; }
.music:hover{ border-color:var(--blue-hi); color:#fff; box-shadow:0 0 18px rgba(74,222,128,.4); }

/* ---------- lyric captions ---------- */
.caption{
  position:fixed; left:50%; bottom:30px; transform:translate(-50%,8px);
  z-index:55; max-width:min(640px,86vw); text-align:center;
  font-family:"Prime",sans-serif; font-size:1.08rem; line-height:1.4; letter-spacing:.01em;
  color:#fff; text-shadow:0 0 12px rgba(74,222,128,.85), 0 2px 6px rgba(0,0,0,.9);

  background:rgba(4,10,6,.42); border:1px solid rgba(74,222,128,.22);
  backdrop-filter:blur(4px);

}
.caption.show{ opacity:1; transform:translate(-50%,0); }

@media (max-width:480px){
  .card{ padding:30px 20px 24px; }
  .name{ font-size:1.7rem; }
  .caption{ font-size:.95rem; bottom:78px; }
}
</style>

<script>
/* ---------- interactive sparkles ---------- */
(function(){
  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d");
  let W, H, DPR, parts = [];
  const mouse = { x:-9999, y:-9999 };

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * DPR;
    H = cv.height = innerHeight * DPR;
    cv.style.width = innerWidth + "px";
    cv.style.height = innerHeight + "px";
    const count = Math.round((innerWidth * innerHeight) / 14000);
    parts = Array.from({length:count}, () => spawn());
  }
  function spawn(){
    const r = (Math.random()*1.6 + 0.5) * DPR;
    return {
      x: Math.random()*W, y: Math.random()*H,
      vx:(Math.random()-.5)*0.12*DPR, vy:(Math.random()-.5)*0.12*DPR,
      r,
      tw: Math.random()*Math.PI*2,
      tws: 0.01 + Math.random()*0.03,
      hue: Math.random() < 0.5 ? "255,255,255" : "180,255,210"
    };
  }

  addEventListener("resize", resize);
  addEventListener("mousemove", e => { mouse.x = e.clientX*DPR; mouse.y = e.clientY*DPR; });
  addEventListener("mouseout", () => { mouse.x = mouse.y = -9999; });
  addEventListener("touchmove", e => {
    const t = e.touches[0]; if(t){ mouse.x = t.clientX*DPR; mouse.y = t.clientY*DPR; }
  }, {passive:true});
  addEventListener("touchend", () => { mouse.x = mouse.y = -9999; });

  function frame(){
    ctx.clearRect(0,0,W,H);
    const rad = 120 * DPR;
    for(const p of parts){
      p.x += p.vx; p.y += p.vy;
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d2 = dx*dx + dy*dy;
      if(d2 < rad*rad){
        const d = Math.sqrt(d2) || 1;
        const force = (1 - d/rad) * 6 * DPR;
        p.x += (dx/d) * force;
        p.y += (dy/d) * force;
      }
      if(p.x < 0) p.x += W; else if(p.x > W) p.x -= W;
      if(p.y < 0) p.y += H; else if(p.y > H) p.y -= H;
      p.tw += p.tws;
      const a = 0.35 + Math.abs(Math.sin(p.tw)) * 0.55;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = "rgba(" + p.hue + "," + a.toFixed(2) + ")";
      ctx.shadowBlur = 6 * DPR;
      ctx.shadowColor = "rgba(74,222,128,0.8)";
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    requestAnimationFrame(frame);
  }
  resize();
  frame();
})();

document.getElementById("year").textContent = new Date().getFullYear();

/* ---------- enter + audio ---------- */
const enter = document.getElementById("enter");
const card  = document.getElementById("card");
const song  = document.getElementById("song");
const mute  = document.getElementById("mute");
const bgvid = document.querySelector(".bgvid");

// keep the background video looping even if the browser ignores the loop attr
bgvid.muted = true;
bgvid.loop = true;
bgvid.addEventListener("ended", ()=>{ bgvid.currentTime = 0; bgvid.play().catch(()=>{}); });
// try to start it right away; if the browser blocks it, the Enter click will
bgvid.play().catch(()=>{});

function open(){
  if(enter.classList.contains("gone")) return;
  enter.classList.add("gone");
  card.classList.add("show");
  mute.classList.add("show");
  // Enter is a user gesture -> unblocks media in strict browsers (LibreWolf)
  bgvid.muted = true;
  bgvid.play().catch(()=>{});
  song.volume = 0.45;
  song.play().catch(()=>{});
}
enter.addEventListener("click", open);
window.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" ") open(); });

// mute / unmute toggle
mute.addEventListener("click", e=>{
  e.stopPropagation();
  song.muted = !song.muted;
  mute.textContent = song.muted ? "🔇" : "🔊";
});

const cap = document.getElementById("caption");
let lastLine = -2;
song.addEventListener("timeupdate", ()=>{
  const now = song.currentTime;
  let idx = -1;
  for(let i=0; i<LYRICS.length; i++){
    if(now >= LYRICS[i].t) idx = i; else break;
  }
  if(idx === lastLine) return;
  lastLine = idx;
  const line = idx >= 0 ? LYRICS[idx].x : "";
  if(line){ cap.textContent = line; cap.classList.add("show"); }
  else { cap.classList.remove("show"); }
});
// hide captions while muted; show again when unmuted
mute.addEventListener("click", ()=>{
  if(song.muted) cap.classList.remove("show");
});

/* ---------- discord copy ---------- */
const dc = document.getElementById("discord");
const sub = document.getElementById("dc-sub");
dc.addEventListener("click", async e=>{
  e.preventDefault();
  try{
    await navigator.clipboard.writeText(dc.dataset.copy);
    const old = sub.textContent;
    sub.textContent = "copied! ✓";
    setTimeout(()=> sub.textContent = old, 1600);
  }catch{ sub.textContent = "16thorn"; }
});
</script>
